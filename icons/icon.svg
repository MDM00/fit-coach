<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="bg" cx="30%" cy="18%" r="95%">
      <stop offset="0" stop-color="#3a1c08"/><stop offset=".45" stop-color="#140a04"/><stop offset="1" stop-color="#050302"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd29a"/><stop offset=".45" stop-color="#ff8a1f"/><stop offset="1" stop-color="#d9480c"/>
    </linearGradient>
    <linearGradient id="bell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff4e8"/><stop offset="1" stop-color="#ffc58a"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ff8a1f" stop-opacity=".55"/><stop offset="1" stop-color="#ff8a1f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <circle cx="512" cy="512" r="400" fill="url(#glow)"/>
  <!-- anello attività -->
  <circle cx="512" cy="512" r="290" fill="none" stroke="#ff8a1f" stroke-opacity=".16" stroke-width="64"/>
  <circle cx="512" cy="512" r="290" fill="none" stroke="url(#ring)" stroke-width="64" stroke-linecap="round"
          stroke-dasharray="1458 1822" transform="rotate(-90 512 512)"/>
  <!-- manubrio -->
  <g transform="rotate(-30 512 512)">
    <rect x="352" y="496" width="320" height="32" rx="16" fill="url(#bell)"/>
    <rect x="318" y="420" width="58" height="184" rx="24" fill="url(#bell)"/>
    <rect x="270" y="448" width="44" height="128" rx="18" fill="url(#bell)"/>
    <rect x="648" y="420" width="58" height="184" rx="24" fill="url(#bell)"/>
    <rect x="710" y="448" width="44" height="128" rx="18" fill="url(#bell)"/>
  </g>
  <rect width="1024" height="1024" fill="url(#gloss)"/>
</svg>
